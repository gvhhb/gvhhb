name: generate-snake

on:
  # 首次提交本 workflow / README 时立即生成一次
  push:
    paths:
      - ".github/workflows/snake.yml"
      - "README*"
  # 每天凌晨自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 也可以在 Actions 页面手动点击 Run workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gvhhb
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: push images back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          git commit -m "chore: update snake" || exit 0
          git push
